apiVersion: v1
kind: Pod
metadata:
  name: backend
  labels:
    app: backend
spec:
  containers:
  - name: app
    image: chain-2-backend:latest
    resources:
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: chain-2-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: chain-2-backend
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
