apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: app
        image: chain-2-backend:latest
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        env:
        - name: GOMAXPROCS
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: chain-2-config
        ports:
        - containerPort: 2000
      - name: sidecar
        image: sidecar-sidecar:latest
        env:
        - name: PROC_NAME
          value: "backend-sidecar"
        - name: GLOG_logtostderr
          value: "1"
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        volumeMounts:
        - name: config-volume
          mountPath: /config.yaml
          subPath: backend.yaml
        ports:
        - containerPort: 3000
        - containerPort: 4000
        - containerPort: 3000
          protocol: UDP
        - containerPort: 4000
          protocol: UDP
      volumes:
      - name: config-volume
        configMap:
          name: approx-configs
---
apiVersion: v1
kind: Service
metadata:
  name: chain-2-backend
  labels:
    app: backend
spec:
  clusterIP: None
  selector:
    app: backend
  ports:
  - name: sidecar-ingress-tcp
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: sidecar-ingress-udp
    port: 3000
    targetPort: 3000
    protocol: UDP
  - name: sidecar-egress-tcp
    port: 4000
    targetPort: 4000
    protocol: TCP
  - name: sidecar-egress-udp
    port: 4000
    targetPort: 4000
    protocol: UDP
