apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: app
        image: chain-2-backend:latest
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        env:
        - name: GOMAXPROCS
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: chain-2-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: chain-2-backend
  labels:
    app: backend
spec:
  clusterIP: None
  selector:
    app: backend
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
