apiVersion: v1
kind: Pod
metadata:
  name: backend5
  labels:
    app: backend5
spec:
  containers:
  - name: app
    image: dynamic-large-backend5:latest
    resources:
      requests:
        cpu: "2"
      limits:
        cpu: "2"
    env:
    - name: GOMAXPROCS
      value: "2"
    envFrom:
    - configMapRef:
        name: dynamic-large-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: dynamic-large-backend5
  labels:
    app: backend5
spec:
  selector:
    app: backend5
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
