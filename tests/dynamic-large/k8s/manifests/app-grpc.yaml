apiVersion: v1
kind: Pod
metadata:
  name: backend1
  labels:
    app: backend1
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: prob-route-fanout-backend1:latest
    resources:
      requests:
        cpu: "4"
      limits:
        cpu: "4"
    env:
    - name: GOMAXPROCS
      value: "4"
    envFrom:
    - configMapRef:
        name: prob-route-fanout-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: prob-route-fanout-backend1
  labels:
    app: backend1
spec:
  selector:
    app: backend1
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

