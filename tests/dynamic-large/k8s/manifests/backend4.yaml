apiVersion: v1
kind: Pod
metadata:
  name: backend4
  labels:
    app: backend4
spec:
  containers:
  - name: app
    image: dynamic-large-backend4:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: dynamic-large-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: dynamic-large-backend4
  labels:
    app: backend4
spec:
  selector:
    app: backend4
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
