apiVersion: v1
kind: Pod
metadata:
  name: backend6
  labels:
    app: backend6
spec:
  containers:
  - name: app
    image: dynamic-large-backend6:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "1"
      limits:
        cpu: "1"
    env:
    - name: GOMAXPROCS
      value: "1"
    envFrom:
    - configMapRef:
        name: dynamic-large-config
    ports:
    - containerPort: 2000
  - name: sidecar
    image: sidecar-sidecar:latest
    imagePullPolicy: Always
    env:
    - name: PROC_NAME
      value: "backend6-sidecar"
    - name: GLOG_logtostderr
      value: "1"
    resources:
      requests:
        cpu: "2"
      limits:
        cpu: "2"
    volumeMounts:
    - name: config-volume
      mountPath: /config.yaml
      subPath: backend6.yaml
    ports:
    - containerPort: 3000
    - containerPort: 4000
    - containerPort: 3000
      protocol: UDP
    - containerPort: 4000
      protocol: UDP
  volumes:
  - name: config-volume
    configMap:
      name: sidecar-configs
---
apiVersion: v1
kind: Service
metadata:
  name: dynamic-large-backend6
  labels:
    app: backend6
spec:
  selector:
    app: backend6
  ports:
  - name: sidecar-ingress-tcp
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: sidecar-ingress-udp
    port: 3000
    targetPort: 3000
    protocol: UDP
  - name: sidecar-egress-tcp
    port: 4000
    targetPort: 4000
    protocol: TCP
  - name: sidecar-egress-udp
    port: 4000
    targetPort: 4000
    protocol: UDP