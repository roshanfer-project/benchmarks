apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend4
  labels:
    app: backend4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend4
  template:
    metadata:
      labels:
        app: backend4
    spec:
      containers:
      - name: app
        image: dynamic-large-backend4:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "3"
          limits:
            cpu: "3"
        env:
        - name: GOMAXPROCS
          value: "3"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: dynamic-large-config
        ports:
        - containerPort: 2000
      - name: sidecar
        image: sidecar-sidecar:latest
        imagePullPolicy: Always
        env:
        - name: PROC_NAME
          value: "backend4-sidecar"
        - name: GLOG_logtostderr
          value: "1"
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        volumeMounts:
        - name: config-volume
          mountPath: /config.yaml
          subPath: backend4.yaml
        ports:
        - containerPort: 3000
        - containerPort: 4000
        - containerPort: 3000
          protocol: UDP
        - containerPort: 4000
          protocol: UDP
      volumes:
      - name: config-volume
        configMap:
          name: amphiqueue-configs
---
apiVersion: v1
kind: Service
metadata:
  name: dynamic-large-backend4
  labels:
    app: backend4
spec:
  clusterIP: None
  selector:
    app: backend4
  ports:
  - name: sidecar-ingress-tcp
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: sidecar-ingress-udp
    port: 3000
    targetPort: 3000
    protocol: UDP
  - name: sidecar-egress-tcp
    port: 4000
    targetPort: 4000
    protocol: TCP
  - name: sidecar-egress-udp
    port: 4000
    targetPort: 4000
    protocol: UDP
