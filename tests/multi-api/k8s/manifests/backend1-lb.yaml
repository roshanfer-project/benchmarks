apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend1
  labels:
    app: backend1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend1
  template:
    metadata:
      labels:
        app: backend1
    spec:
      containers:
      - name: app
        image: multi-api-backend1:latest
        resources:
          requests:
            cpu: "2"
          limits:
            cpu: "2"
        env:
        - name: GOMAXPROCS
          value: "2"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: multi-api-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: multi-api-backend1
  labels:
    app: backend1
spec:
  clusterIP: None
  selector:
    app: backend1
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
