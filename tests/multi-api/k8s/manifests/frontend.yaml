apiVersion: v1
kind: Pod
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  containers:
  - name: app
    image: multi-api-frontend:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: multi-api-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: multi-api-frontend
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
