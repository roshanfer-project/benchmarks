  labels:
    app: rajomon-client
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: chain4-lb-rajomon-client:latest
    resources:
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: chain4-lb-config
    ports:
    - containerPort: 2007
---
apiVersion: v1
kind: Service
metadata:
  name: chain4-lb-entry
  labels:
    app: rajomon-client
spec:
  type: NodePort
  selector:
    app: rajomon-client
  ports:
  - name: http
    port: 2007
    targetPort: 2007
    nodePort: 3000
    protocol: TCP
