apiVersion: v1
kind: Pod
metadata:
  name: backend1
  labels:
    app: backend1
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: chain4-lb-backend1:latest
    resources:
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: chain4-lb-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: chain4-lb-backend1
  labels:
    app: backend1
spec:
  selector:
    app: backend1
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

