apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-grpc
  labels:
    app: frontend-grpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-grpc
  template:
    metadata:
      labels:
        app: frontend-grpc
    spec:
      containers:
      - name: app
        image: ingress-stress-frontend-grpc:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "3"
          limits:
            cpu: "3"
        env:
        - name: GOMAXPROCS
          value: "3"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: ingress-stress-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-stress-frontend-grpc
  labels:
    app: frontend-grpc
spec:
  clusterIP: None
  selector:
    app: frontend-grpc
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rajomon-client
  labels:
    app: rajomon-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rajomon-client
  template:
    metadata:
      labels:
        app: rajomon-client
    spec:
      containers:
      - name: app
        image: ingress-stress-rajomon-client:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "3"
          limits:
            cpu: "3"
        env:
        - name: GOMAXPROCS
          value: "3"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: ingress-stress-config
        ports:
        - containerPort: 2007
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-stress-entry
  labels:
    app: rajomon-client
spec:
  type: NodePort
  selector:
    app: rajomon-client
  ports:
  - name: http
    port: 2007
    targetPort: 2007
    nodePort: 3000
    protocol: TCP
