apiVersion: v1
kind: Pod
metadata:
  name: frontend-grpc
  labels:
    app: frontend-grpc
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: ingress-stress-frontend-grpc:latest
    resources:
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: ingress-stress-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-stress-frontend-grpc
  labels:
    app: frontend-grpc
spec:
  selector:
    app: frontend-grpc
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

---
apiVersion: v1
kind: Pod
metadata:
  name: rajomon-client
  labels:
    app: rajomon-client
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: ingress-stress-rajomon-client:latest
    resources:
      requests:
        cpu: "4"
      limits:
        cpu: "4"
    env:
    - name: GOMAXPROCS
      value: "4"
    envFrom:
    - configMapRef:
        name: ingress-stress-config
    ports:
    - containerPort: 2007
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-stress-entry
  labels:
    app: rajomon-client
spec:
  type: NodePort
  selector:
    app: rajomon-client
  ports:
  - name: http
    port: 2007
    targetPort: 2007
    nodePort: 3000
    protocol: TCP
