apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend2
  labels:
    app: backend2
spec:
  replicas: 8
  selector:
    matchLabels:
      app: backend2
  template:
    metadata:
      labels:
        app: backend2
    spec:
      containers:
      - name: app
        image: fanin-lb-scale-backend2:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        env:
        - name: GOMAXPROCS
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: fanin-lb-scale-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fanin-lb-scale-backend2
  labels:
    app: backend2
spec:
  clusterIP: None
  selector:
    app: backend2
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
