apiVersion: v1
kind: Pod
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  containers:
  - name: app
    image: fanin-lb-scale-frontend:latest
    resources:
      requests:
        cpu: "12"
      limits:
        cpu: "12"
    env:
    - name: GOMAXPROCS
      value: "12"
    envFrom:
    - configMapRef:
        name: fanin-lb-scale-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fanin-lb-scale-frontend
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
