apiVersion: v1
kind: Pod
metadata:
  name: backend1
  labels:
    app: backend1
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: fanin-lb-scale-backend1:latest
    resources:
      requests:
        cpu: "8"
      limits:
        cpu: "8"
    env:
    - name: GOMAXPROCS
      value: "8"
    envFrom:
    - configMapRef:
        name: fanin-lb-scale-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fanin-lb-scale-backend1
  labels:
    app: backend1
spec:
  selector:
    app: backend1
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

