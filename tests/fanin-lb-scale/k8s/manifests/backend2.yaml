apiVersion: v1
kind: Pod
metadata:
  name: backend2
  labels:
    app: backend2
spec:
  containers:
  - name: app
    image: fanin-lb-scale-backend2:latest
    resources:
      requests:
        cpu: "10"
      limits:
        cpu: "10"
    env:
    - name: GOMAXPROCS
      value: "10"
    envFrom:
    - configMapRef:
        name: fanin-lb-scale-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fanin-lb-scale-backend2
  labels:
    app: backend2
spec:
  selector:
    app: backend2
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
