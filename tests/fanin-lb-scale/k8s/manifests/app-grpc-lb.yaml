apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend1
  labels:
    app: backend1
spec:
  replicas: 10
  selector:
    matchLabels:
      app: backend1
  template:
    metadata:
      labels:
        app: backend1
    spec:
      containers:
      - name: app
        image: fanin-lb-scale-backend1:latest
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        env:
        - name: GOMAXPROCS
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: fanin-lb-scale-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fanin-lb-scale-backend1
  labels:
    app: backend1
spec:
  clusterIP: None
  selector:
    app: backend1
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

