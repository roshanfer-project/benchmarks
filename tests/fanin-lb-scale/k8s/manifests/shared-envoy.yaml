apiVersion: v1
kind: Pod
metadata:
  name: shared
  labels:
    app: shared
spec:
  containers:
  - name: app
    image: fanin-lb-scale-shared:latest
    resources:
      requests:
        cpu: "10"
      limits:
        cpu: "10"
    env:
    - name: GOMAXPROCS
      value: "10"
    envFrom:
    - configMapRef:
        name: fanin-lb-scale-config
    ports:
    - containerPort: 2000
  - name: envoy
    image: envoyproxy/envoy:v1.32-latest
    args:
    - "-c"
    - "/etc/envoy/envoy.yaml"
    - "--log-level"
    - "warn"
    - "--concurrency"
    - "1"
    - "--disable-hot-restart"
    resources:
      requests:
        cpu: "1"
      limits:
        cpu: "1"
    volumeMounts:
    - name: config-volume
      mountPath: /etc/envoy/envoy.yaml
      subPath: shared.yaml
    ports:
    - containerPort: 3000
    - containerPort: 4000
    - containerPort: 9901
  - name: envoy-stats
    image: envoy-stats-exporter:latest
    env:
    - name: APP_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.labels['app']
    - name: POLL_INTERVAL_MS
      value: "200"
    - name: OUTPUT_PATH
      value: "/tmp/envoy_stats.csv"
    resources:
      requests:
        memory: 16Mi
        cpu: 10m
      limits:
        memory: 32Mi
        cpu: 50m
  volumes:
  - name: config-volume
    configMap:
      name: envoy-configs
---
apiVersion: v1
kind: Service
metadata:
  name: fanin-lb-scale-shared
  labels:
    app: shared
spec:
  selector:
    app: shared
  ports:
  - name: envoy-ingress-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: envoy-egress
    port: 4000
    targetPort: 4000
    protocol: TCP
