syntax = "proto3";

package benchmark;

option go_package = "faninlbscale/protobuf";

message Request { string payload = 1; }
message Response { string payload = 1; }

service backend1 {
  rpc f2(Request) returns (Response);
  rpc f3(Request) returns (Response);
}

service backend2 {
  rpc f4(Request) returns (Response);
}

service frontend {
  rpc f1(Request) returns (Response);
  rpc g1(Request) returns (Response);
}

service shared {
  rpc f5(Request) returns (Response);
}

