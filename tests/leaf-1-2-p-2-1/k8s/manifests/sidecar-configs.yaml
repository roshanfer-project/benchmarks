apiVersion: v1
kind: ConfigMap
metadata:
  name: sidecar-configs
data:
  frontend.yaml: |
    mapping:
      api1:
      api2:
    ring_size: 1000
    buffer_count: 4096
    buffer_size: 80000
    num_threads: 1
    egress_listener_port: 4000
    ingress_listener_port: 3000
    ingress_upstream_host: localhost
    ingress_upstream_port: 2000
    report_latency: True
    name: frontend
    is_frontend: True
    frontend_pool_connections: 200
    cpu_count: 5
    over_commitment: 0.0
    extra_limit: 0
    
  ingress.yaml: |
    routing:
      api1:
        upstream:
          host: leaf-1-2-p-2-1-frontend
          port: 3000
        slo: 475
        priority: 0
      api2:
        upstream:
          host: leaf-1-2-p-2-1-frontend
          port: 3000
        slo: 475
        priority: 1
    mapping:
      api1:
        downstreams:
          - api1
        listen_port: 3000
      api2:
        downstreams:
          - api2
        listen_port: 3001
    ring_size: 4000
    buffer_count: 16384
    buffer_size: 10000
    num_threads: 2
    ingress_pool_connections: 200
    egress_listener_port: 3000
    ingress_listener_port: 4000
    ingress_upstream_host: localhost
    ingress_upstream_port: 2000
    is_ingress: True
    is_frontend: False
    report_latency: True
    name: ingress
    