apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: app
        image: one-service-frontend:latest
        resources:
          requests:
            cpu: "3"
          limits:
            cpu: "3"
        env:
        - name: GOMAXPROCS
          value: "3"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: one-service-config
        ports:
        - containerPort: 2000
      - name: sidecar
        image: sidecar-sidecar:latest
        env:
        - name: PROC_NAME
          value: "frontend-sidecar"
        - name: GLOG_logtostderr
          value: "1"
        resources:
          requests:
            cpu: "0.5"
          limits:
            cpu: "0.5"
        volumeMounts:
        - name: config-volume
          mountPath: /config.yaml
          subPath: frontend.yaml
        ports:
        - containerPort: 3000
        - containerPort: 4000
        - containerPort: 3000
          protocol: UDP
        - containerPort: 4000
          protocol: UDP
      volumes:
      - name: config-volume
        configMap:
          name: approx-configs
---
apiVersion: v1
kind: Service
metadata:
  name: one-service-frontend
  labels:
    app: frontend
spec:
  clusterIP: None
  selector:
    app: frontend
  ports:
  - name: sidecar-ingress-tcp
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: sidecar-ingress-udp
    port: 3000
    targetPort: 3000
    protocol: UDP
  - name: sidecar-egress-tcp
    port: 4000
    targetPort: 4000
    protocol: TCP
  - name: sidecar-egress-udp
    port: 4000
    targetPort: 4000
    protocol: UDP
