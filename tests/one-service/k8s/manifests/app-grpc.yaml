apiVersion: v1
kind: Pod
metadata:
  name: frontend-grpc
  labels:
    app: frontend-grpc
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: one-service-frontend-grpc:latest
    resources:
      requests:
        cpu: "1"
      limits:
        cpu: "1"
    env:
    - name: GOMAXPROCS
      value: "1"
    envFrom:
    - configMapRef:
        name: one-service-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: one-service-frontend-grpc
  labels:
    app: frontend-grpc
spec:
  selector:
    app: frontend-grpc
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

---
apiVersion: v1
kind: Pod
metadata:
  name: rajomon-client
  labels:
    app: rajomon-client
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: one-service-rajomon-client:latest
    resources:
      requests:
        cpu: "2"
      limits:
        cpu: "2"
    env:
    - name: GOMAXPROCS
      value: "2"
    envFrom:
    - configMapRef:
        name: one-service-config
    ports:
    - containerPort: 2007
---
apiVersion: v1
kind: Service
metadata:
  name: one-service-entry
  labels:
    app: rajomon-client
spec:
  type: NodePort
  selector:
    app: rajomon-client
  ports:
  - name: http
    port: 2007
    targetPort: 2007
    nodePort: 3000
    protocol: TCP
