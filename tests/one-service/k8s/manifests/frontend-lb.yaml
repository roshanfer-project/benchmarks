apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: app
        image: one-service-frontend:latest
        resources:
          requests:
            cpu: "3"
          limits:
            cpu: "3"
        env:
        - name: GOMAXPROCS
          value: "3"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: one-service-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: one-service-frontend
  labels:
    app: frontend
spec:
  clusterIP: None
  selector:
    app: frontend
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
