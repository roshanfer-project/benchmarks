apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend4
  labels:
    app: backend4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend4
  template:
    metadata:
      labels:
        app: backend4
    spec:
      containers:
      - name: app
        image: pfanout-4-backend4:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "4"
          limits:
            cpu: "4"
        env:
        - name: GOMAXPROCS
          value: "4"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: pfanout-4-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: pfanout-4-backend4
  labels:
    app: backend4
spec:
  clusterIP: None
  selector:
    app: backend4
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
