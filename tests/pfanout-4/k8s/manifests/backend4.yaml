apiVersion: v1
kind: Pod
metadata:
  name: backend4
  labels:
    app: backend4
spec:
  containers:
  - name: app
    image: pfanout-4-backend4:latest
    resources:
      requests:
        cpu: "4"
      limits:
        cpu: "4"
    env:
    - name: GOMAXPROCS
      value: "4"
    envFrom:
    - configMapRef:
        name: pfanout-4-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: pfanout-4-backend4
  labels:
    app: backend4
spec:
  selector:
    app: backend4
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
