apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: app
        image: fanin-lb-frontend:latest
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        env:
        - name: GOMAXPROCS
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: fanin-lb-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fanin-lb-frontend
  labels:
    app: frontend
spec:
  clusterIP: None
  selector:
    app: frontend
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
