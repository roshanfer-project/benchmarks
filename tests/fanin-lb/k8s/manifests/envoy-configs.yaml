apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-configs
data:
  backend1.yaml: |
    node:
      id: backend1
      cluster: local
    
    stats_config:
      stats_matcher:
        inclusion_list:
          patterns:
          - prefix: "http.inbound_"
    stats_flush_interval: 5s
    
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    
    static_resources:
      listeners:
      - name: listener_inbound_f2
        address:
          socket_address: { address: 0.0.0.0, port_value: 3000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: inbound_f2
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: local
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/benchmark.backend1/f2" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/f2" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "unknown inbound path" } }
    
              http2_protocol_options: {}
    
      - name: listener_inbound_f3
        address:
          socket_address: { address: 0.0.0.0, port_value: 3001 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: inbound_f3
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: local
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/benchmark.backend1/f3" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/f3" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "unknown inbound path" } }
    
              http2_protocol_options: {}
    
      - name: listener_outbound
        address:
          socket_address: { address: 0.0.0.0, port_value: 4000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: outbound
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: egress
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/benchmark.shared/f5" }
                    route: { cluster: shared-f5-in, timeout: 10s }
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "no egress route" } }
    
              http2_protocol_options: {}
    
      clusters:
      - name: local_app
        connect_timeout: 2s
        type: STATIC
        load_assignment:
          cluster_name: local_app
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: 127.0.0.1, port_value: 2000 }
        http2_protocol_options: {}
    
      - name: shared-f5-in
        connect_timeout: 2s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: shared-f5-in
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: fanin-lb-shared
                    port_value: 3000
        http2_protocol_options:
          max_concurrent_streams: 100
    
    
