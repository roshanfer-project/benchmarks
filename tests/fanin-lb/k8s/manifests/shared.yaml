apiVersion: v1
kind: Pod
metadata:
  name: shared
  labels:
    app: shared
spec:
  containers:
  - name: app
    image: fanin-lb-shared:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "4"
      limits:
        cpu: "4"
    env:
    - name: GOMAXPROCS
      value: "4"
    envFrom:
    - configMapRef:
        name: fanin-lb-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fanin-lb-shared
  labels:
    app: shared
spec:
  selector:
    app: shared
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
