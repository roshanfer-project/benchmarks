apiVersion: v1
kind: Pod
metadata:
  name: shared
  labels:
    app: shared
spec:
  containers:
  - name: app
    image: fan-out-fan-in-heavy-shared:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "5"
      limits:
        cpu: "5"
    env:
    - name: GOMAXPROCS
      value: "5"
    envFrom:
    - configMapRef:
        name: fan-out-fan-in-heavy-config
    ports:
    - containerPort: 2000
  - name: sidecar
    image: sidecar-sidecar:latest
    imagePullPolicy: Always
    env:
    - name: PROC_NAME
      value: "shared-sidecar"
    - name: GLOG_logtostderr
      value: "1"
    resources:
      requests:
        cpu: "2"
      limits:
        cpu: "2"
    volumeMounts:
    - name: config-volume
      mountPath: /config.yaml
      subPath: shared.yaml
    ports:
    - containerPort: 3000
    - containerPort: 4000
    - containerPort: 3000
      protocol: UDP
    - containerPort: 4000
      protocol: UDP
  volumes:
  - name: config-volume
    configMap:
      name: sidecar-configs
---
apiVersion: v1
kind: Service
metadata:
  name: fan-out-fan-in-heavy-shared
  labels:
    app: shared
spec:
  selector:
    app: shared
  ports:
  - name: sidecar-ingress-tcp
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: sidecar-ingress-udp
    port: 3000
    targetPort: 3000
    protocol: UDP
  - name: sidecar-egress-tcp
    port: 4000
    targetPort: 4000
    protocol: TCP
  - name: sidecar-egress-udp
    port: 4000
    targetPort: 4000
    protocol: UDP