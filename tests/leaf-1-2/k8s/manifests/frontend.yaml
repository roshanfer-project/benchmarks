apiVersion: v1
kind: Pod
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  containers:
  - name: app
    image: leaf-1-2-frontend:latest
    resources:
      requests:
        cpu: "5"
      limits:
        cpu: "5"
    env:
    - name: GOMAXPROCS
      value: "5"
    envFrom:
    - configMapRef:
        name: leaf-1-2-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: leaf-1-2-frontend
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
