apiVersion: v1
kind: Pod
metadata:
  name: backend7
  labels:
    app: backend7
spec:
  containers:
  - name: app
    image: prob-route-fanout-backend7:latest
    resources:
      requests:
        cpu: "2"
      limits:
        cpu: "2"
    env:
    - name: GOMAXPROCS
      value: "2"
    envFrom:
    - configMapRef:
        name: prob-route-fanout-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: prob-route-fanout-backend7
  labels:
    app: backend7
spec:
  selector:
    app: backend7
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
