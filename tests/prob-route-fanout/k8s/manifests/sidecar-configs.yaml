apiVersion: v1
kind: ConfigMap
metadata:
  name: sidecar-configs
data:
  backend1.yaml: |
    routing:
      benchmark.backend2/f3:
        upstream:
          host: prob-route-fanout-backend2
          port: 3000
      benchmark.backend3/f4:
        upstream:
          host: prob-route-fanout-backend3
          port: 3000
    mapping:
      benchmark.backend1/f2:
        downstreams:
          - benchmark.backend2/f3
          - benchmark.backend3/f4
        dfanout: true
    ring_size: 1000
    buffer_count: 1024
    buffer_size: 80000
    num_threads: 1
    egress_listener_port: 4000
    ingress_listener_port: 3000
    ingress_upstream_host: localhost
    ingress_upstream_port: 2000
    report_latency: True
    name: backend1
    cpu_count: 4
    over_commitment: 0.0
    
