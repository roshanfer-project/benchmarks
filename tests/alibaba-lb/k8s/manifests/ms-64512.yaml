apiVersion: v1
kind: Pod
metadata:
  name: ms-64512
  labels:
    app: ms-64512
spec:
  containers:
  - name: app
    image: alibaba-lb-ms-64512:latest
    resources:
      requests:
        cpu: "8"
      limits:
        cpu: "8"
    env:
    - name: GOMAXPROCS
      value: "8"
    envFrom:
    - configMapRef:
        name: alibaba-lb-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-lb-ms-64512
  labels:
    app: ms-64512
spec:
  selector:
    app: ms-64512
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
