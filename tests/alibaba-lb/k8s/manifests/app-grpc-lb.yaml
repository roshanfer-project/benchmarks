apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-25806
  labels:
    app: ms-25806
spec:
  replicas: 8
  selector:
    matchLabels:
      app: ms-25806
  template:
    metadata:
      labels:
        app: ms-25806
    spec:
      containers:
      - name: app
        image: alibaba-lb-ms-25806:latest
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        env:
        - name: GOMAXPROCS
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: alibaba-lb-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-lb-ms-25806
  labels:
    app: ms-25806
spec:
  clusterIP: None
  selector:
    app: ms-25806
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

