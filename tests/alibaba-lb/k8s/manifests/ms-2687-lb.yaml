apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-2687
  labels:
    app: ms-2687
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ms-2687
  template:
    metadata:
      labels:
        app: ms-2687
    spec:
      containers:
      - name: app
        image: alibaba-lb-ms-2687:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        env:
        - name: GOMAXPROCS
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: alibaba-lb-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-lb-ms-2687
  labels:
    app: ms-2687
spec:
  clusterIP: None
  selector:
    app: ms-2687
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
