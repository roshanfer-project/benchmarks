apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-64512
  labels:
    app: ms-64512
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ms-64512
  template:
    metadata:
      labels:
        app: ms-64512
    spec:
      containers:
      - name: app
        image: alibaba-lb-ms-64512:latest
        resources:
          requests:
            cpu: "2.6666666666666665"
          limits:
            cpu: "2.6666666666666665"
        env:
        - name: GOMAXPROCS
          value: "3"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: alibaba-lb-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-lb-ms-64512
  labels:
    app: ms-64512
spec:
  clusterIP: None
  selector:
    app: ms-64512
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
