apiVersion: v1
kind: Pod
metadata:
  name: ms-25806
  labels:
    app: ms-25806
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: alibaba-lb-ms-25806:latest
    resources:
      requests:
        cpu: "8"
      limits:
        cpu: "8"
    env:
    - name: GOMAXPROCS
      value: "8"
    envFrom:
    - configMapRef:
        name: alibaba-lb-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-lb-ms-25806
  labels:
    app: ms-25806
spec:
  selector:
    app: ms-25806
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

