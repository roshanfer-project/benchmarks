apiVersion: v1
kind: Pod
metadata:
  name: backend1
  labels:
    app: backend1
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: fan-out-fan-in-backend1:latest
    resources:
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: fan-out-fan-in-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fan-out-fan-in-backend1
  labels:
    app: backend1
spec:
  selector:
    app: backend1
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

