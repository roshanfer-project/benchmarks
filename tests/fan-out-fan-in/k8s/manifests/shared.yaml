apiVersion: v1
kind: Pod
metadata:
  name: shared
  labels:
    app: shared
spec:
  containers:
  - name: app
    image: fan-out-fan-in-shared:latest
    resources:
      requests:
        cpu: "4"
      limits:
        cpu: "4"
    env:
    - name: GOMAXPROCS
      value: "4"
    envFrom:
    - configMapRef:
        name: fan-out-fan-in-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fan-out-fan-in-shared
  labels:
    app: shared
spec:
  selector:
    app: shared
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
