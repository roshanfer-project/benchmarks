apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared
  labels:
    app: shared
spec:
  replicas: 4
  selector:
    matchLabels:
      app: shared
  template:
    metadata:
      labels:
        app: shared
    spec:
      containers:
      - name: app
        image: fan-out-fan-in-shared:latest
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        env:
        - name: GOMAXPROCS
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: fan-out-fan-in-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fan-out-fan-in-shared
  labels:
    app: shared
spec:
  clusterIP: None
  selector:
    app: shared
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
