apiVersion: v1
kind: Pod
metadata:
  name: app
  labels:
    app: app
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: test1-app:latest
    resources:
      requests:
        cpu: "5"
      limits:
        cpu: "5"
    envFrom:
    - configMapRef:
        name: test1-config
    ports:
    - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  type: NodePort
  selector:
    app: app
  ports:
  - name: http-tcp
    port: 3000
    targetPort: 3000
    nodePort: 3000
    protocol: TCP
  - name: http-udp
    port: 3000
    targetPort: 3000
    nodePort: 3000
    protocol: UDP
