apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: test1-app:latest
        resources:
          requests:
            cpu: "5"
          limits:
            cpu: "5"
        envFrom:
        - configMapRef:
            name: test1-config
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  type: NodePort
  selector:
    app: app
  ports:
  - name: http-tcp
    port: 3000
    targetPort: 3000
    nodePort: 30000
    protocol: TCP
  - name: http-udp
    port: 3000
    targetPort: 3000
    nodePort: 30000
    protocol: UDP
