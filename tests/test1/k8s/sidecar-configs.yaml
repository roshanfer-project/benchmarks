apiVersion: v1
kind: ConfigMap
metadata:
  name: sidecar-configs
  namespace: default
data:
  ingress.yaml: |
    routing:
      api1:
        upstream:
          host: app # Service name in K8s
          port: 3007
        slo: 150
        priority: 0
      api2:
        upstream:
          host: app
          port: 3007
        slo: 300
        priority: 1
    mapping:
      api1:
        downstreams: [api1]
        listen_port: 3000
      api2:
        downstreams: [api2]
        listen_port: 3008
    ring_size: 12000
    buffer_count: 16384
    buffer_size: 10000
    num_threads: 2
    ingress_pool_connections: 50
    egress_listener_port: 3000
    ingress_listener_port: 4000
    ingress_upstream_host: localhost # Loopback
    ingress_upstream_port: 2000
    is_ingress: True
    is_frontend: False
    report_latency: True
    name: ingress

  app.yaml: |
    mapping:
      api1:
      api2:
      api3:
    ring_size: 10000
    buffer_count: 32768
    buffer_size: 20000
    num_threads: 1
    frontend_pool_connections: 50
    egress_listener_port: 4007
    ingress_listener_port: 3007
    ingress_upstream_host: localhost # App container in the same pod
    ingress_upstream_port: 2007
    is_ingress: False
    is_frontend: True
    report_latency: True
    cpu_count: 5
    over_commitment: 0
    name: app
