apiVersion: v1
kind: Pod
metadata:
  name: ingress
  labels:
    app: ingress
spec:
  restartPolicy: Never
  containers:
  - name: sidecar
    image: sidecar-sidecar:latest
    env:
    - name: PROC_NAME
      value: "ingress-sidecar"
    - name: GLOG_logtostderr
      value: "1"
    resources:
      requests:
        cpu: "6"
      limits:
        cpu: "6"
    volumeMounts:
    - name: config-volume
      mountPath: /config.yaml
      subPath: ingress.yaml
#        - name: usr-local-lib
#          mountPath: /usr/local/lib
#          readOnly: true
#        - name: lib-x86-64
#          mountPath: /lib/x86_64-linux-gnu
#          readOnly: true
  volumes:
  - name: config-volume
    configMap:
      name: sidecar-configs
  - name: usr-local-lib
    hostPath:
      path: /usr/local/lib
  - name: lib-x86-64
    hostPath:
      path: /lib/x86_64-linux-gnu
---
apiVersion: v1
kind: Service
metadata:
  name: ingress
spec:
  type: NodePort
  selector:
    app: ingress
  ports:
  - name: app-tcp
    port: 3000
    targetPort: 3000
    nodePort: 3000
    protocol: TCP
  - name: app-udp
    port: 3000
    targetPort: 3000
    nodePort: 3000
    protocol: UDP
  - name: app2-tcp
    port: 3008
    targetPort: 3008
    nodePort: 3008
    protocol: TCP
  - name: app2-udp
    port: 3008
    targetPort: 3008
    nodePort: 3008
    protocol: UDP
  - name: app3-tcp
    port: 3009
    targetPort: 3009
    nodePort: 3009
    protocol: TCP
  - name: app3-udp
    port: 3009
    targetPort: 3009
    nodePort: 3009
    protocol: UDP
