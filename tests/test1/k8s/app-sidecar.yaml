apiVersion: v1
kind: Pod
metadata:
  name: app
  labels:
    app: app
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: test1-app:latest
    resources:
      requests:
        cpu: "5"
      limits:
        cpu: "5"
    envFrom:
    - configMapRef:
        name: test1-config
    ports:
    - containerPort: 2007
  
  - name: sidecar
    image: sidecar-sidecar:latest
    env:
    - name: PROC_NAME
      value: "app-sidecar"
    - name: GLOG_logtostderr
      value: "1"
    resources:
      requests:
        cpu: "2"
      limits:
        cpu: "2"
    volumeMounts:
    - name: config-volume
      mountPath: /config.yaml
      subPath: app.yaml
#        - name: usr-local-lib
#          mountPath: /usr/local/lib
#          readOnly: true
#        - name: lib-x86-64
#          mountPath: /lib/x86_64-linux-gnu
#          readOnly: true
  volumes:
  - name: config-volume
    configMap:
      name: sidecar-configs
  - name: usr-local-lib
    hostPath:
      path: /usr/local/lib
  - name: lib-x86-64
    hostPath:
      path: /lib/x86_64-linux-gnu
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: app
  ports:
  - name: grpc-sidecar-tcp
    port: 3007
    targetPort: 3007
    protocol: TCP
  - name: grpc-sidecar-udp
    port: 3007
    targetPort: 3007
    protocol: UDP
