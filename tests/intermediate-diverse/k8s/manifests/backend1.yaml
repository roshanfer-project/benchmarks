apiVersion: v1
kind: Pod
metadata:
  name: backend1
  labels:
    app: backend1
spec:
  containers:
  - name: app
    image: intermediate-diverse-backend1:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "1"
      limits:
        cpu: "1"
    env:
    - name: GOMAXPROCS
      value: "1"
    envFrom:
    - configMapRef:
        name: intermediate-diverse-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: intermediate-diverse-backend1
  labels:
    app: backend1
spec:
  selector:
    app: backend1
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
