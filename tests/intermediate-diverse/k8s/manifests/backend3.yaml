apiVersion: v1
kind: Pod
metadata:
  name: backend3
  labels:
    app: backend3
spec:
  containers:
  - name: app
    image: intermediate-diverse-backend3:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: intermediate-diverse-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: intermediate-diverse-backend3
  labels:
    app: backend3
spec:
  selector:
    app: backend3
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
