apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-configs
data:
  frontend.yaml: |
    node:
      id: frontend
      cluster: local
    
    stats_config:
      stats_matcher:
        inclusion_list:
          patterns:
          - prefix: "http.inbound_"
    stats_flush_interval: 5s
    
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    
    static_resources:
      listeners:
      - name: listener_inbound_f1
        address:
          socket_address: { address: 0.0.0.0, port_value: 3000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: inbound_f1
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: local
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/benchmark.frontend/f1" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/f1" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "unknown inbound path" } }
    
    
      - name: listener_inbound_f2
        address:
          socket_address: { address: 0.0.0.0, port_value: 3001 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: inbound_f2
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: local
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/benchmark.frontend/f2" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/f2" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "unknown inbound path" } }
    
    
      - name: listener_outbound
        address:
          socket_address: { address: 0.0.0.0, port_value: 4000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: outbound
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: egress
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "no egress route" } }
    
              http2_protocol_options: {}
    
      clusters:
      - name: local_app
        connect_timeout: 2s
        type: STATIC
        load_assignment:
          cluster_name: local_app
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: 127.0.0.1, port_value: 2000 }
    
    
  ingress.yaml: |
    node:
      id: ingress
      cluster: local
    
    stats_config:
      stats_matcher:
        inclusion_list:
          patterns:
          - prefix: "http.ingress_"
    stats_flush_interval: 5s
    
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    
    static_resources:
      listeners:
      - name: listener_f1
        address:
          socket_address: { address: 0.0.0.0, port_value: 3000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_f1
              generate_request_id: false
              use_remote_address: true
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: entry
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/f1" }
                    route: { cluster: entry-f1, timeout: 10s }
    
      - name: listener_f2
        address:
          socket_address: { address: 0.0.0.0, port_value: 3001 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_f2
              generate_request_id: false
              use_remote_address: true
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: entry
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/f2" }
                    route: { cluster: entry-f2, timeout: 10s }
    
      clusters:
      - name: entry-f1
        connect_timeout: 2s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: entry-f1
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: leaf-diverse-frontend
                    port_value: 3000
    
      - name: entry-f2
        connect_timeout: 2s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: entry-f2
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: leaf-diverse-frontend
                    port_value: 3001
    
    