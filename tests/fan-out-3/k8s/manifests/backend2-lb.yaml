apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend2
  labels:
    app: backend2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend2
  template:
    metadata:
      labels:
        app: backend2
    spec:
      containers:
      - name: app
        image: fan-out-3-backend2:latest
        resources:
          requests:
            cpu: "3"
          limits:
            cpu: "3"
        env:
        - name: GOMAXPROCS
          value: "3"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: fan-out-3-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fan-out-3-backend2
  labels:
    app: backend2
spec:
  clusterIP: None
  selector:
    app: backend2
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
