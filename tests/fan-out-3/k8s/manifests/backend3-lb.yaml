apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend3
  labels:
    app: backend3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend3
  template:
    metadata:
      labels:
        app: backend3
    spec:
      containers:
      - name: app
        image: fan-out-3-backend3:latest
        resources:
          requests:
            cpu: "4"
          limits:
            cpu: "4"
        env:
        - name: GOMAXPROCS
          value: "4"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: fan-out-3-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fan-out-3-backend3
  labels:
    app: backend3
spec:
  clusterIP: None
  selector:
    app: backend3
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
