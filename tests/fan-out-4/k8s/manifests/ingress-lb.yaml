apiVersion: v1
kind: Pod
metadata:
  name: ingress
  labels:
    app: ingress
spec:
  restartPolicy: Never
  containers:
  - name: sidecar
    image: sidecar-sidecar:latest
    env:
    - name: PROC_NAME
      value: "ingress-sidecar"
    - name: GLOG_logtostderr
      value: "1"
    resources:
      requests:
        cpu: "2"
      limits:
        cpu: "2"
    volumeMounts:
    - name: config-volume
      mountPath: /config.yaml
      subPath: ingress.yaml
    ports:
    - containerPort: 3000
    - containerPort: 3000
      protocol: UDP
    - containerPort: 4000
    - containerPort: 4000
      protocol: UDP
  volumes:
  - name: config-volume
    configMap:
      name: amphiqueue-configs
---
apiVersion: v1
kind: Service
metadata:
  name: fan-out-4-ingress
  labels:
    app: ingress
spec:
  type: NodePort
  selector:
    app: ingress
  ports:
  - name: sidecar-3000-tcp
    port: 3000
    targetPort: 3000
    nodePort: 3000
    protocol: TCP
  - name: sidecar-3000-udp
    port: 3000
    targetPort: 3000
    nodePort: 3000
    protocol: UDP
  - name: sidecar-4000-tcp
    port: 4000
    targetPort: 4000
    protocol: TCP
  - name: sidecar-4000-udp
    port: 4000
    targetPort: 4000
    protocol: UDP
