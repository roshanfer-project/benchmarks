apiVersion: v1
kind: Pod
metadata:
  name: backend2
  labels:
    app: backend2
spec:
  containers:
  - name: app
    image: fan-out-4-backend2:latest
    resources:
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: fan-out-4-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: fan-out-4-backend2
  labels:
    app: backend2
spec:
  selector:
    app: backend2
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
