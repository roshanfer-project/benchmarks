apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: app
        image: chain2-lb-backend:latest
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        env:
        - name: GOMAXPROCS
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: chain2-lb-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: chain2-lb-backend
  labels:
    app: backend
spec:
  clusterIP: None
  selector:
    app: backend
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-grpc
  labels:
    app: frontend-grpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-grpc
  template:
    metadata:
      labels:
        app: frontend-grpc
    spec:
      containers:
      - name: app
        image: chain2-lb-frontend-grpc:latest
        resources:
          requests:
            cpu: "2"
          limits:
            cpu: "2"
        env:
        - name: GOMAXPROCS
          value: "2"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: chain2-lb-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: chain2-lb-frontend-grpc
  labels:
    app: frontend-grpc
spec:
  clusterIP: None
  selector:
    app: frontend-grpc
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rajomon-client
  labels:
    app: rajomon-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rajomon-client
  template:
    metadata:
      labels:
        app: rajomon-client
    spec:
      containers:
      - name: app
        image: chain2-lb-rajomon-client:latest
        resources:
          requests:
            cpu: "2"
          limits:
            cpu: "2"
        env:
        - name: GOMAXPROCS
          value: "2"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: chain2-lb-config
        ports:
        - containerPort: 2007
---
apiVersion: v1
kind: Service
metadata:
  name: chain2-lb-entry
  labels:
    app: rajomon-client
spec:
  type: NodePort
  selector:
    app: rajomon-client
  ports:
  - name: http
    port: 2007
    targetPort: 2007
    nodePort: 3000
    protocol: TCP
