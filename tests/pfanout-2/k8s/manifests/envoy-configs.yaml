apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-configs
data:
  backend1.yaml: |
    node:
      id: backend1
      cluster: local
    
    stats_config:
      stats_matcher:
        inclusion_list:
          patterns:
          - prefix: "http.inbound_"
    stats_flush_interval: 5s
    
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    
    static_resources:
      listeners:
      - name: listener_inbound_svc
        address:
          socket_address: { address: 0.0.0.0, port_value: 3000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: inbound_svc
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: local
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/benchmark.backend1/svc" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/svc" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "unknown inbound path" } }
    
              http2_protocol_options: {}
    
      - name: listener_outbound
        address:
          socket_address: { address: 0.0.0.0, port_value: 4000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: outbound
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: egress
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "no egress route" } }
    
              http2_protocol_options: {}
    
      clusters:
      - name: local_app
        connect_timeout: 2s
        type: STATIC
        load_assignment:
          cluster_name: local_app
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: 127.0.0.1, port_value: 2000 }
        http2_protocol_options: {}
    
    
  backend2.yaml: |
    node:
      id: backend2
      cluster: local
    
    stats_config:
      stats_matcher:
        inclusion_list:
          patterns:
          - prefix: "http.inbound_"
    stats_flush_interval: 5s
    
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    
    static_resources:
      listeners:
      - name: listener_inbound_svc
        address:
          socket_address: { address: 0.0.0.0, port_value: 3000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: inbound_svc
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: local
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/benchmark.backend2/svc" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/svc" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "unknown inbound path" } }
    
              http2_protocol_options: {}
    
      - name: listener_outbound
        address:
          socket_address: { address: 0.0.0.0, port_value: 4000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: outbound
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: egress
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "no egress route" } }
    
              http2_protocol_options: {}
    
      clusters:
      - name: local_app
        connect_timeout: 2s
        type: STATIC
        load_assignment:
          cluster_name: local_app
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: 127.0.0.1, port_value: 2000 }
        http2_protocol_options: {}
    
    
  frontend.yaml: |
    node:
      id: frontend
      cluster: local
    
    stats_config:
      stats_matcher:
        inclusion_list:
          patterns:
          - prefix: "http.inbound_"
    stats_flush_interval: 5s
    
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    
    static_resources:
      listeners:
      - name: listener_inbound_api
        address:
          socket_address: { address: 0.0.0.0, port_value: 3000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: inbound_api
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: local
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/benchmark.frontend/api" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/api" }
                    route: { cluster: local_app, timeout: 10s }
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "unknown inbound path" } }
    
    
      - name: listener_outbound
        address:
          socket_address: { address: 0.0.0.0, port_value: 4000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: outbound
              generate_request_id: false
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: egress
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/benchmark.backend1/svc" }
                    route: { cluster: backend1-svc-in, timeout: 10s }
                  - match: { prefix: "/benchmark.backend2/svc" }
                    route: { cluster: backend2-svc-in, timeout: 10s }
                  - match: { prefix: "/" }
                    direct_response: { status: 404, body: { inline_string: "no egress route" } }
    
              http2_protocol_options: {}
    
      clusters:
      - name: local_app
        connect_timeout: 2s
        type: STATIC
        load_assignment:
          cluster_name: local_app
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: 127.0.0.1, port_value: 2000 }
    
      - name: backend1-svc-in
        connect_timeout: 2s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: backend1-svc-in
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: pfanout-2-backend1
                    port_value: 3000
        http2_protocol_options:
          max_concurrent_streams: 100
    
      - name: backend2-svc-in
        connect_timeout: 2s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: backend2-svc-in
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: pfanout-2-backend2
                    port_value: 3000
        http2_protocol_options:
          max_concurrent_streams: 100
    
    
  ingress.yaml: |
    node:
      id: ingress
      cluster: local
    
    stats_config:
      stats_matcher:
        inclusion_list:
          patterns:
          - prefix: "http.ingress_"
    stats_flush_interval: 5s
    
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    
    static_resources:
      listeners:
      - name: listener_api
        address:
          socket_address: { address: 0.0.0.0, port_value: 3000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_api
              generate_request_id: false
              use_remote_address: true
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                virtual_hosts:
                - name: entry
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/api" }
                    route: { cluster: entry-api, timeout: 10s }
    
      clusters:
      - name: entry-api
        connect_timeout: 2s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: entry-api
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: pfanout-2-frontend
                    port_value: 3000
    
    