apiVersion: v1
kind: ConfigMap
metadata:
  name: approx-configs
data:
  backend1.yaml: |
    mapping:
      benchmark.backend1/svc:
    ring_size: 1000
    buffer_count: 1024
    buffer_size: 80000
    num_threads: 1
    egress_listener_port: 4000
    ingress_listener_port: 3000
    ingress_upstream_host: localhost
    ingress_upstream_port: 2000
    report_latency: True
    name: backend1
    cpu_count: 2
    over_commitment: 0.0
    mesh_late_binding: False
    
  backend2.yaml: |
    mapping:
      benchmark.backend2/svc:
    ring_size: 1000
    buffer_count: 1024
    buffer_size: 80000
    num_threads: 1
    egress_listener_port: 4000
    ingress_listener_port: 3000
    ingress_upstream_host: localhost
    ingress_upstream_port: 2000
    report_latency: True
    name: backend2
    cpu_count: 2
    over_commitment: 0.0
    mesh_late_binding: False
    
  frontend.yaml: |
    routing:
      benchmark.backend1/svc:
        upstream:
          host: pfanout-2-backend1
          port: 3000
      benchmark.backend2/svc:
        upstream:
          host: pfanout-2-backend2
          port: 3000
    mapping:
      api:
        downstreams:
          - benchmark.backend1/svc
          - benchmark.backend2/svc
        pfanout: true
    ring_size: 1000
    buffer_count: 4096
    buffer_size: 80000
    num_threads: 1
    egress_listener_port: 4000
    ingress_listener_port: 3000
    ingress_upstream_host: localhost
    ingress_upstream_port: 2000
    report_latency: True
    name: frontend
    is_frontend: True
    frontend_pool_connections: 200
    cpu_count: 3
    over_commitment: 0.0
    mesh_late_binding: False
    
  ingress.yaml: |
    routing:
      api:
        upstream:
          host: pfanout-2-frontend
          port: 3000
        slo: 10
        priority: 0
    mapping:
      api:
        downstreams:
          - api
        listen_port: 3000
    ring_size: 4000
    buffer_count: 16384
    buffer_size: 10000
    num_threads: 1
    ingress_pool_connections: 200
    egress_listener_port: 3000
    ingress_listener_port: 4000
    ingress_upstream_host: localhost
    ingress_upstream_port: 2000
    is_ingress: True
    lb_mode: True
    is_frontend: False
    report_latency: True
    name: ingress
    