apiVersion: v1
kind: Pod
metadata:
  name: ms-7103
  labels:
    app: ms-7103
spec:
  containers:
  - name: app
    image: alibaba-large-ms-7103:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "7"
      limits:
        cpu: "7"
    env:
    - name: GOMAXPROCS
      value: "7"
    envFrom:
    - configMapRef:
        name: alibaba-large-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-large-ms-7103
  labels:
    app: ms-7103
spec:
  selector:
    app: ms-7103
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
