apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-5720
  labels:
    app: ms-5720
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-5720
  template:
    metadata:
      labels:
        app: ms-5720
    spec:
      containers:
      - name: app
        image: alibaba-large-ms-5720:latest
        resources:
          requests:
            cpu: "4"
          limits:
            cpu: "4"
        env:
        - name: GOMAXPROCS
          value: "4"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: alibaba-large-config
        ports:
        - containerPort: 2000
      - name: sidecar
        image: sidecar-sidecar:latest
        env:
        - name: PROC_NAME
          value: "ms-5720-sidecar"
        - name: GLOG_logtostderr
          value: "1"
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        volumeMounts:
        - name: config-volume
          mountPath: /config.yaml
          subPath: ms-5720.yaml
        ports:
        - containerPort: 3000
        - containerPort: 4000
        - containerPort: 3000
          protocol: UDP
        - containerPort: 4000
          protocol: UDP
      volumes:
      - name: config-volume
        configMap:
          name: sidecar-lb-configs
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-large-ms-5720
  labels:
    app: ms-5720
spec:
  clusterIP: None
  selector:
    app: ms-5720
  ports:
  - name: sidecar-ingress-tcp
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: sidecar-ingress-udp
    port: 3000
    targetPort: 3000
    protocol: UDP
  - name: sidecar-egress-tcp
    port: 4000
    targetPort: 4000
    protocol: TCP
  - name: sidecar-egress-udp
    port: 4000
    targetPort: 4000
    protocol: UDP
