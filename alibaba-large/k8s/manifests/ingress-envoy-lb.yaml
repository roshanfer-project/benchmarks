apiVersion: v1
kind: Pod
metadata:
  name: ingress
  labels:
    app: ingress
spec:
  restartPolicy: Never
  containers:
  - name: envoy
    image: envoyproxy/envoy:v1.32-latest
    args:
    - "-c"
    - "/etc/envoy/envoy.yaml"
    - "--log-level"
    - "warn"
    - "--concurrency"
    - "2"
    - "--disable-hot-restart"
    resources:
      requests:
        cpu: "2"
      limits:
        cpu: "2"
    volumeMounts:
    - name: config-volume
      mountPath: /etc/envoy/envoy.yaml
      subPath: ingress.yaml
    ports:
    - containerPort: 3000
    - containerPort: 9901
  volumes:
  - name: config-volume
    configMap:
      name: p2c-envoy-configs
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-large-ingress
  labels:
    app: ingress
spec:
  type: NodePort
  selector:
    app: ingress
  ports:
  - name: envoy-3000
    port: 3000
    targetPort: 3000
    nodePort: 3000
    protocol: TCP
