apiVersion: v1
kind: Pod
metadata:
  name: ms-25806
  labels:
    app: ms-25806
spec:
  containers:
  - name: app
    image: alibaba-large-ms-25806:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "8"
      limits:
        cpu: "8"
    env:
    - name: GOMAXPROCS
      value: "8"
    envFrom:
    - configMapRef:
        name: alibaba-large-config
    ports:
    - containerPort: 2000
  - name: envoy
    image: envoyproxy/envoy:v1.32-latest
    args:
    - "-c"
    - "/etc/envoy/envoy.yaml"
    - "--log-level"
    - "warn"
    - "--concurrency"
    - "1"
    - "--disable-hot-restart"
    resources:
      requests:
        cpu: "1"
      limits:
        cpu: "1"
    volumeMounts:
    - name: config-volume
      mountPath: /etc/envoy/envoy.yaml
      subPath: ms-25806.yaml
    ports:
    - containerPort: 3000
    - containerPort: 3001
    - containerPort: 3002
    - containerPort: 4000
    - containerPort: 9901
  - name: envoy-stats
    image: envoy-stats-exporter:latest
    imagePullPolicy: Always
    env:
    - name: APP_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.labels['app']
    - name: POLL_INTERVAL_MS
      value: "200"
    - name: OUTPUT_PATH
      value: "/tmp/envoy_stats.csv"
    resources:
      requests:
        memory: 16Mi
        cpu: 10m
      limits:
        memory: 32Mi
        cpu: 50m
  volumes:
  - name: config-volume
    configMap:
      name: envoy-configs
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-large-ms-25806
  labels:
    app: ms-25806
spec:
  selector:
    app: ms-25806
  ports:
  - name: envoy-ingress-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: envoy-ingress-3001
    port: 3001
    targetPort: 3001
    protocol: TCP
  - name: envoy-ingress-3002
    port: 3002
    targetPort: 3002
    protocol: TCP
  - name: envoy-egress
    port: 4000
    targetPort: 4000
    protocol: TCP
