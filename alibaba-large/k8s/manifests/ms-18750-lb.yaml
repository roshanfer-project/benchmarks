apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-18750
  labels:
    app: ms-18750
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-18750
  template:
    metadata:
      labels:
        app: ms-18750
    spec:
      containers:
      - name: app
        image: alibaba-large-ms-18750:latest
        resources:
          requests:
            cpu: "3"
          limits:
            cpu: "3"
        env:
        - name: GOMAXPROCS
          value: "3"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: alibaba-large-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-large-ms-18750
  labels:
    app: ms-18750
spec:
  clusterIP: None
  selector:
    app: ms-18750
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
