apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-12657
  labels:
    app: ms-12657
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-12657
  template:
    metadata:
      labels:
        app: ms-12657
    spec:
      containers:
      - name: app
        image: alibaba-large-ms-12657:latest
        resources:
          requests:
            cpu: "3"
          limits:
            cpu: "3"
        env:
        - name: GOMAXPROCS
          value: "3"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: alibaba-large-config
        ports:
        - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-large-ms-12657
  labels:
    app: ms-12657
spec:
  clusterIP: None
  selector:
    app: ms-12657
  ports:
  - name: grpc
    port: 2000
    targetPort: 2000
    protocol: TCP

