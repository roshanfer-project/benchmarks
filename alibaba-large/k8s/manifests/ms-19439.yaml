apiVersion: v1
kind: Pod
metadata:
  name: ms-19439
  labels:
    app: ms-19439
spec:
  containers:
  - name: app
    image: alibaba-large-ms-19439:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "5"
      limits:
        cpu: "5"
    env:
    - name: GOMAXPROCS
      value: "5"
    envFrom:
    - configMapRef:
        name: alibaba-large-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-large-ms-19439
  labels:
    app: ms-19439
spec:
  selector:
    app: ms-19439
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
