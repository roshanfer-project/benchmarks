apiVersion: v1
kind: Pod
metadata:
  name: ms-2687
  labels:
    app: ms-2687
spec:
  containers:
  - name: app
    image: alibaba-large-ms-2687:latest
    resources:
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: alibaba-large-config
    ports:
    - containerPort: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: alibaba-large-ms-2687
  labels:
    app: ms-2687
spec:
  selector:
    app: ms-2687
  ports:
  - name: http
    port: 2000
    targetPort: 2000
    protocol: TCP
