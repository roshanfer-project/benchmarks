routing:
  - service: search.Search/Nearby
    upstream:
      host: search-sidecar
      port: 3005
  - service: protobuf.Profile/GetProfiles
    upstream:
      host: profile-sidecar
      port: 3001
  - service: reservation.Reservation/MakeReservation
    upstream:
      host: reservation-sidecar
      port: 3002
  - service: reservation.Reservation/CheckAvailability
    upstream:
      host: reservation-sidecar
      port: 3002
  - service: user.User/CheckUser
    upstream:
      host: user-sidecar
      port: 3006
mapping:
  hotels:
    downstreams:
      - search.Search/Nearby
      - protobuf.Profile/GetProfiles
      - reservation.Reservation/CheckAvailability
    min_max_concurrency: 7
  reservation:
    downstreams:
      - user.User/CheckUser
      - reservation.Reservation/MakeReservation
    min_max_concurrency: 4
ring_size: 6000
buffer_count: 2000
buffer_size: 80000
egress_listener_port: 4008
ingress_listener_port: 3008
ingress_upstream_host: 172.17.0.1
ingress_upstream_port: 2008
is_ingress: False
is_frontend: True
ppm_limit: 7
report_latency: False
name: frontend-2