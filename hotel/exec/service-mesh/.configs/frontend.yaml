routing:
  search.Search/Nearby:
    upstream:
      host: search-sidecar
      port: 3005
  protobuf.Profile/GetProfiles:
    upstream:
      host: profile-sidecar
      port: 3001
  reservation.Reservation/MakeReservation:
    upstream:
      host: reservation-sidecar
      port: 3002
  reservation.Reservation/CheckAvailability:
    upstream:
      host: reservation-sidecar
      port: 3002
  user.User/CheckUser:
    upstream:
      host: user-sidecar
      port: 3006
mapping:
  hotels:
    downstreams:
      - search.Search/Nearby
      - protobuf.Profile/GetProfiles
      - reservation.Reservation/CheckAvailability
    min_max_concurrency: 20
    limit: 31
  reservation:
    downstreams:
      - user.User/CheckUser
      - reservation.Reservation/MakeReservation
    min_max_concurrency: 3
    limit: 14
ring_size: 6000
buffer_count: 2000
buffer_size: 80000
frontend_pool_connections: 100
num_threads: 2
egress_listener_port: 4007
ingress_listener_port: 3007
ingress_upstream_host: 172.17.0.1
ingress_upstream_port: 2007
is_ingress: False
is_frontend: True
ppm_limit: 50
report_latency: True
name: frontend