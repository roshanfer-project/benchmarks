node:
  id: search
  cluster: local

static_resources:
  listeners:
  # ───────────────────────── 1.  Inbound traffic to Service A ─────────────────────────
  - name: listener_inbound
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 3005
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: envoy
#          generate_request_id: true
          use_remote_address: true
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: local_app
                  timeout: 100s
          http2_protocol_options: {}

  # ───────────────────────── 2.  Outbound traffic from Service A ──────────────────────
  - name: listener_outbound
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 4005
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: envoy
#          generate_request_id: true
          use_remote_address: true
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local_route
            virtual_hosts:
            - name: rate
              domains: ["*"]
              routes:
              - match:
                  prefix: "/rate.Rate"
                route:
                  cluster: rate-service
                  timeout: 100s
              - match:
                  prefix: "/geo.Geo"
                route:
                  cluster: geo-service
                  timeout: 100s
          http2_protocol_options: {}

  clusters:
  # ───────────────────────── 3.  Local application (Service A) ────────────────────────
  - name: local_app
    connect_timeout: 2s
    type: STATIC
    load_assignment:
      cluster_name: local_app
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 172.17.0.1, port_value: 2005 }
    http2_protocol_options: {}        # gRPC requires H2

  # ───────────────────────── 4.  Remote dependencies ─────────────────────────────────
  - name: geo-service
    connect_timeout: 2s
    type: STRICT_DNS                  # resolves each call
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: geo-service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: geo-envoy
                port_value: 3004
    http2_protocol_options: {}

  - name: rate-service
    connect_timeout: 2s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: rate-service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: rate-envoy
                port_value: 3003
    http2_protocol_options: {}