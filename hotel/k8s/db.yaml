# --- Memcached Profile ---
apiVersion: v1
kind: Pod
metadata:
  name: memcached-profile
  labels:
    app: memcached-profile
spec:
  restartPolicy: Never
  containers:
  - name: memcached-profile
    image: memcached:latest
    resources:
      requests:
        cpu: "1"
      limits:
        cpu: "1"
    ports:
    - containerPort: 11211
    env:
    - name: MEMCACHED_CACHE_SIZE
      value: "128"
    - name: MEMCACHED_THREADS
      value: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: memcached-profile
  labels:
    app: memcached-profile
spec:
  ports:
  - port: 11211
    targetPort: 11211
