# MongoDB and Memcached Deployment for Hotel Benchmark
# Resources set to 1 CPU as requested.

# --- MongoDB Geo ---
apiVersion: v1
kind: Pod
metadata:
  name: mongodb-geo
  labels:
    app: mongodb-geo
spec:
  restartPolicy: Never
  containers:
  - name: mongodb-geo
    image: mongo:5.0
    resources:
      requests:
        cpu: "1"
      limits:
        cpu: "1"
    ports:
    - containerPort: 27017
    volumeMounts:
    - name: geo-data
      mountPath: /data/db
  volumes:
  - name: geo-data
    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-geo
  labels:
    app: mongodb-geo
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: mongodb-geo

