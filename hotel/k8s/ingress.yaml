apiVersion: v1
kind: Pod
metadata:
  name: ingress
  labels:
    app: ingress
spec:
  restartPolicy: Never
  containers:
  - name: sidecar
    image: sidecar-sidecar:latest
    env:
    - name: PROC_NAME
      value: "ingress-sidecar"
    - name: GLOG_logtostderr
      value: "1"
    resources:
      requests:
        cpu: "4"
      limits:
        cpu: "4"
    volumeMounts:
    - name: config-volume
      mountPath: /config.yaml
      subPath: ingress.yaml
    ports:
    - containerPort: 3000
    - containerPort: 3009
  volumes:
  - name: config-volume
    configMap:
      name: sidecar-configs
  - name: usr-local-lib
    hostPath:
      path: /usr/local/lib
  - name: lib-x86-64
    hostPath:
      path: /lib/x86_64-linux-gnu
---
apiVersion: v1
kind: Service
metadata:
  name: ingress
spec:
  type: NodePort
  selector:
    app: ingress
  ports:
  - name: hotels
    port: 3000
    targetPort: 3000
    nodePort: 3000
    protocol: TCP
  - name: hotels-udp
    port: 3000
    targetPort: 3000
    nodePort: 3000
    protocol: UDP
  - name: reservation
    port: 3009
    targetPort: 3009
    nodePort: 3009
    protocol: TCP
  - name: reservation-udp
    port: 3009
    targetPort: 3009
    nodePort: 3009
    protocol: UDP
