# Rajomon Client (HTTP Entry Point)
apiVersion: v1
kind: Pod
metadata:
  name: rajomon-client
  labels:
    app: rajomon-client
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: rajomon-client:latest
    resources:
      requests:
        cpu: "4"
      limits:
        cpu: "4"
    env:
    - name: GOMAXPROCS
      value: "4"
    envFrom:
    - configMapRef:
        name: hotel-config
    ports:
    - containerPort: 2007
---
# Frontend GRPC (Logic)
apiVersion: v1
kind: Pod
metadata:
  name: frontend-grpc
  labels:
    app: frontend-grpc
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: frontend-grpc:latest
    resources:
      requests:
        cpu: "4"
      limits:
        cpu: "4"
    env:
    - name: GOMAXPROCS
      value: "4"
    envFrom:
    - configMapRef:
        name: hotel-config
    ports:
    - containerPort: 2009
---
# Service for Frontend GRPC (Internal)
apiVersion: v1
kind: Service
metadata:
  name: frontend-grpc
  labels:
    app: frontend-grpc
spec:
  selector:
    app: frontend-grpc
  ports:
  - name: grpc
    port: 2009
    targetPort: 2009
    protocol: TCP
---
# Public Service (NodePort) - Points to Rajomon Client
apiVersion: v1
kind: Service
metadata:
  name: hotel-frontend
  labels:
    app: rajomon-client
spec:
  type: NodePort
  selector:
    app: rajomon-client
  ports:
  - name: http
    port: 2007
    targetPort: 2007
    nodePort: 3000
    protocol: TCP
---
