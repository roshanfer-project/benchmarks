apiVersion: v1
kind: Pod
metadata:
  name: ingress
  labels:
    app: ingress
spec:
  restartPolicy: Never
  containers:
  - name: sidecar
    image: sidecar-sidecar:latest
    env:
    - name: PROC_NAME
      value: "ingress-sidecar"
    - name: GLOG_logtostderr
      value: "1"
    resources:
      requests:
        cpu: "6"
      limits:
        cpu: "6"
    volumeMounts:
    - name: config-volume
      mountPath: /config.yaml
      subPath: ingress.yaml
    ports:
    - containerPort: 3000
    - containerPort: 3000
      protocol: UDP
    - containerPort: 3008
    - containerPort: 3009
    - containerPort: 3008
      protocol: UDP
    - containerPort: 3009
      protocol: UDP
  
  volumes:
  - name: config-volume
    configMap:
      name: sidecar-configs

---
apiVersion: v1
kind: Service
metadata:
  name: social-ingress
  labels:
    app: ingress
spec:
  type: NodePort
  selector:
    app: ingress
  ports:
  - name: sidecar-grpc
    port: 3000
    targetPort: 3000
    nodePort: 3000
    protocol: TCP
  - name: sidecar-grpc-udp
    port: 3000
    targetPort: 3000
    nodePort: 3000
    protocol: UDP
  - name: home-api
    port: 3008
    targetPort: 3008
    nodePort: 3008
    protocol: TCP
  - name: home-api-udp
    port: 3008
    targetPort: 3008
    nodePort: 3008
    protocol: UDP
  - name: user-api
    port: 3009
    targetPort: 3009
    nodePort: 3009
    protocol: TCP
  - name: user-api-udp
    port: 3009
    targetPort: 3009
    nodePort: 3009
    protocol: UDP
