
# Graph
apiVersion: v1
kind: Pod
metadata:
  name: graph
  labels:
    app: graph
spec:
  containers:
  - name: app
    image: graph:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "2"
      limits:
        cpu: "2"
    env:
    - name: GOMAXPROCS
      value: "2"
    envFrom:
    - configMapRef:
        name: social-config
    ports:
    - containerPort: 2004
---
apiVersion: v1
kind: Service
metadata:
  name: social-graph
  labels:
    app: graph
spec:
  selector:
    app: graph
  ports:
  - port: 2004
    targetPort: 2004
    protocol: TCP

