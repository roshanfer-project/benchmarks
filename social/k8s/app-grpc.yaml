---
# Rajomon Client (HTTP Entry Point)
apiVersion: v1
kind: Pod
metadata:
  name: rajomon-client
  labels:
    app: rajomon-client
spec:
  containers:
  - name: app
    image: rajomon-client:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "4"
      limits:
        cpu: "4"
    env:
    - name: GOMAXPROCS
      value: "4"
    envFrom:
    - configMapRef:
        name: social-config
    ports:
    - containerPort: 2009

---
# Service for Rajomon Client (Replaces social-nginx NodePort)
apiVersion: v1
kind: Service
metadata:
  name: social-nginx
  labels:
    app: rajomon-client
spec:
  type: NodePort
  selector:
    app: rajomon-client
  ports:
  - name: http
    port: 2009
    targetPort: 2009
    nodePort: 3000
    protocol: TCP

---
# Nginx GRPC (Internal Logic)
apiVersion: v1
kind: Pod
metadata:
  name: nginx-grpc
  labels:
    app: nginx-grpc
spec:
  containers:
  - name: app
    image: nginx-grpc:latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: social-config
    ports:
    - containerPort: 2007

---
# Service for Nginx GRPC
apiVersion: v1
kind: Service
metadata:
  name: social-nginx-grpc
  labels:
    app: nginx-grpc
spec:
  selector:
    app: nginx-grpc
  ports:
  - port: 2007
    targetPort: 2007
    protocol: TCP
