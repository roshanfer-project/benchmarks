  labels:
    app: nginx
spec:
  containers:
  - name: app
    image: nginx:latest
    resources:
      # Nginx is a "frontend" type service, giving it 2 cores
      requests:
        cpu: "3"
      limits:
        cpu: "3"
    env:
    - name: GOMAXPROCS
      value: "3"
    envFrom:
    - configMapRef:
        name: social-config
    ports:
    - containerPort: 2007
---
