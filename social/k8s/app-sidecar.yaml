# ConfigMap removed. Generated by deploy.sh

# Graph
apiVersion: v1
kind: Pod
metadata:
  name: graph
  labels:
    app: graph
spec:
  containers:
  - name: app
    image: graph:latest
    resources:
      requests:
        cpu: "1"
      limits:
        cpu: "1"
    env:
    - name: GOMAXPROCS
      value: "1"
    envFrom:
    - configMapRef:
        name: social-config
    ports:
    - containerPort: 2004
  
  - name: sidecar
    image: sidecar-sidecar:latest
    env:
    - name: PROC_NAME
      value: "graph-sidecar"
    - name: GLOG_logtostderr
      value: "1"
    resources:
      requests:
        cpu: "2"
      limits:
        cpu: "2"
    volumeMounts:
    - name: config-volume
      mountPath: /config.yaml
      subPath: graph.yaml
    ports:
    - containerPort: 3004 # Ingress Listener
    - containerPort: 4004 # Egress Listener (if any)

  volumes:
  - name: config-volume
    configMap:
      name: sidecar-configs
---
apiVersion: v1
kind: Service
metadata:
  name: social-graph
  labels:
    app: graph
spec:
  selector:
    app: graph
  ports:
  - name: sidecar-grpc
    port: 3004
    targetPort: 3004
    protocol: TCP

