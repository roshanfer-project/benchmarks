node:
  id: rate
  cluster: local

stats_config:
  stats_matcher:
    reject_all: true

stats_flush_interval: 30s

admin:                       # (optional but handy)
  access_log_path: /tmp/envoy_admin.log
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
  # ───────────────────────── 1.  Inbound traffic to Service A ─────────────────────────
  - name: listener_inbound
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 3003
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: envoy
          generate_request_id: false
          use_remote_address: true
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: local_app
                  timeout: 100s
          http2_protocol_options: {}

  clusters:
  # ───────────────────────── 3.  Local application (Service A) ────────────────────────
  - name: local_app
    connect_timeout: 2s
    type: STATIC
    load_assignment:
      cluster_name: local_app
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 172.17.0.1, port_value: 2003 }
    http2_protocol_options: {}        # gRPC requires H2