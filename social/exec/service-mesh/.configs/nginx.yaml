  protobuf.HomeTimeline/ReadHomeTimeline:
    upstream:
      host: home-sidecar
      port: 3002
  protobuf.UserTimeline/ReadUserTimeline:
    upstream:
      host: user-sidecar
      port: 3001
mapping:
  compose:
    downstreams:
      - protobuf.ComposePost/ComposePost
  home:
    downstreams:
      - protobuf.HomeTimeline/ReadHomeTimeline
  user:
    downstreams:
      - protobuf.UserTimeline/ReadUserTimeline
