    upstream:
      host: compose-sidecar
      port: 3005
  protobuf.HomeTimeline/ReadHomeTimeline:
    upstream:
      host: home-sidecar
      port: 3002
  protobuf.UserTimeline/ReadUserTimeline:
    upstream:
      host: user-sidecar
      port: 3001
mapping:
  compose:
    downstreams:
      - protobuf.ComposePost/ComposePost
    min_max_concurrency: 20
    limit: 30
  home:
    downstreams:
      - protobuf.HomeTimeline/ReadHomeTimeline
    min_max_concurrency: 3
    limit: 11
  user:
    downstreams:
      - protobuf.UserTimeline/ReadUserTimeline
    min_max_concurrency: 3
    limit: 9
ring_size: 10000
buffer_count: 10000
buffer_size: 80000
num_threads: 2
egress_listener_port: 4007
ingress_listener_port: 3007
ingress_upstream_host: 172.17.0.1
ingress_upstream_port: 2007
is_ingress: False
is_frontend: True
ppm_limit: 46
