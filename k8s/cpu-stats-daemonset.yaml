apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cpu-stats-exporter
  namespace: kube-system
  labels:
    app: cpu-stats-exporter
spec:
  selector:
    matchLabels:
      app: cpu-stats-exporter
  template:
    metadata:
      labels:
        app: cpu-stats-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: cpu-stats-exporter
        image: farzad1132/cpu-stats-exporter:latest
        ports:
        - containerPort: 9100
          protocol: TCP
          name: http
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: cgroup
          mountPath: /sys/fs/cgroup
          readOnly: true
        resources:
          requests:
            memory: 20Mi
            cpu: 50m
          limits:
            memory: 50Mi
            cpu: 100m
        securityContext:
          privileged: true
      volumes:
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
      tolerations:
      - effect: NoSchedule
        operator: Exists
